services:
  bot:
    build: .
    container_name: videotg
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - videotg-data:/app/data
      # Кэш npm и Chrome HyperFrames
      - videotg-npm:/root/.npm
      - videotg-chrome:/root/.cache/hyperframes
    shm_size: "1gb"

volumes:
  videotg-data:
  videotg-npm:
  videotg-chrome:
